[package]
name = "rust-iot-thermostat-central"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4.0"
tokio = { version = "1.0", features = ["full"] }
btleplug = "0.11.7"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
futures-util = "0.3"
